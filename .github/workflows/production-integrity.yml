name: Production Integrity

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify critical frontend assets
        env:
          FRONTEND_URL: https://wassel-project.vercel.app
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.FRONTEND_URL.replace(/\/$/, '');
            const assets = [
              '/',
              '/index.html',
              '/style.css',
              '/liquid-glass.css',
              '/liquid-glass-v2.css',
              '/liquid-glass-interaction.js',
              '/social-auth.js',
              '/sw.js',
              '/manifest.webmanifest',
              '/icon.svg',
            ];
            for (const path of assets) {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 15000);
              try {
                const response = await fetch(base + path, {
                  signal: controller.signal,
                  redirect: 'follow',
                  headers: { 'Cache-Control': 'no-cache' },
                });
                console.log(`${path} -> ${response.status}`);
                if (!response.ok) throw new Error(`Asset ${path} returned HTTP ${response.status}`);
              } finally {
                clearTimeout(timer);
              }
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify backend health contract
        env:
          API_BASE_URL: https://wassel-backend-ds3n.onrender.com
        run: |
          node <<'NODE'
          (async () => {
            const response = await fetch(`${process.env.API_BASE_URL}/health`, {
              headers: { 'Cache-Control': 'no-cache' },
            });
            const body = await response.text();
            console.log(`health -> ${response.status} ${body}`);
            if (response.status !== 200) throw new Error(`Health returned HTTP ${response.status}`);
            const payload = JSON.parse(body);
            if (payload.ok !== true || payload.database !== 'connected') {
              throw new Error('Backend health contract is not satisfied');
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify unauthenticated API stays protected
        env:
          API_BASE_URL: https://wassel-backend-ds3n.onrender.com
        run: |
          node <<'NODE'
          (async () => {
            const checks = [
              ['/orders', 401],
              ['/drivers/nearby?lat=36.8065&lng=10.1815', 401],
            ];
            for (const [path, expected] of checks) {
              const response = await fetch(process.env.API_BASE_URL + path);
              const body = await response.text();
              console.log(`${path} -> ${response.status} ${body.slice(0, 250)}`);
              if (response.status !== expected) throw new Error(`Expected ${expected} from ${path}`);
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
