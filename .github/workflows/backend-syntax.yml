name: Backend Syntax

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wassel-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wassel-backend/package-lock.json

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
