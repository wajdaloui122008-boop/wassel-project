name: JavaScript Syntax

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          find wassel-backend -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          find wassel -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
