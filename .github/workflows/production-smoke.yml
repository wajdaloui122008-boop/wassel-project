name: Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check production frontend shell
        env:
          FRONTEND_URL: https://wassel-project.vercel.app
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.FRONTEND_URL.replace(/\/$/, '');
            const paths = ['/', '/index.html', '/style.css', '/script.js', '/manifest.webmanifest'];
            for (const path of paths) {
              const url = base + path;
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 15000);
              try {
                const response = await fetch(url, { signal: controller.signal, redirect: 'follow' });
                console.log(`${url} -> ${response.status}`);
                if (!response.ok) process.exit(1);
              } finally { clearTimeout(timer); }
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Check production backend health
        env:
          HEALTH_URL: https://wassel-backend-ds3n.onrender.com/health
        run: |
          node <<'NODE'
          (async () => {
            const url = process.env.HEALTH_URL;
            const attempts = 3;
            let lastError = null;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 60000);
              try {
                const response = await fetch(url, { signal: controller.signal, redirect: 'follow' });
                const body = await response.text();
                console.log(`Attempt ${attempt}/${attempts}: ${url} -> ${response.status} ${body}`);
                if (response.status === 200) {
                  let payload;
                  try { payload = JSON.parse(body); } catch (error) { lastError = error; }
                  if (payload?.ok === true && payload?.database === 'connected' && payload?.service === 'wassel-backend') return;
                  lastError = new Error('Health payload did not report a connected production database');
                } else {
                  lastError = new Error(`Health endpoint returned HTTP ${response.status}`);
                }
              } catch (error) {
                lastError = error;
                console.error(`Attempt ${attempt}/${attempts} failed:`, error.message);
              } finally {
                clearTimeout(timer);
              }
              if (attempt < attempts) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw lastError || new Error('Production backend health check failed');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
