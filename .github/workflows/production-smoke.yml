name: Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check production frontend shell
        env:
          FRONTEND_URL: https://wassel-project.vercel.app
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.FRONTEND_URL.replace(/\/$/, '');
            const paths = ['/', '/index.html', '/style.css', '/script.js', '/social-auth.js', '/runtime-guard.js', '/service-ux-v1.js', '/order-tracking-enhancements.js', '/driver-actions-fix.js', '/driver-active-ux.js', '/manifest.webmanifest', '/sw.js'];
            for (const path of paths) {
              const url = base + path;
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 15000);
              try {
                const response = await fetch(url, { signal: controller.signal, redirect: 'follow' });
                console.log(`${url} -> ${response.status}`);
                if (!response.ok) process.exit(1);
              } finally { clearTimeout(timer); }
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Check production backend health
        env:
          HEALTH_URL: https://wassel-backend-ds3n.onrender.com/health
        run: |
          node <<'NODE'
          (async () => {
            const url = process.env.HEALTH_URL;
            const attempts = 3;
            let lastError = null;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 60000);
              try {
                const response = await fetch(url, { signal: controller.signal, redirect: 'follow' });
                const body = await response.text();
                console.log(`Attempt ${attempt}/${attempts}: ${url} -> ${response.status} ${body}`);
                if (response.status === 200) {
                  let payload;
                  try { payload = JSON.parse(body); } catch (error) { lastError = error; }
                  if (payload?.ok === true && payload?.database === 'connected' && payload?.service === 'wassel-backend') return;
                  lastError = new Error('Health payload did not report a connected production database');
                } else {
                  lastError = new Error(`Health endpoint returned HTTP ${response.status}`);
                }
              } catch (error) {
                lastError = error;
                console.error(`Attempt ${attempt}/${attempts} failed:`, error.message);
              } finally {
                clearTimeout(timer);
              }
              if (attempt < attempts) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw lastError || new Error('Production backend health check failed');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Check production API authentication guard
        env:
          API_BASE_URL: https://wassel-backend-ds3n.onrender.com
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.API_BASE_URL.replace(/\/$/, '');
            const checks = [
              { path: '/orders', expected: 401 },
              { path: '/auth/me', headers: { Authorization: 'Bearer not-a-valid-jwt' }, expected: 401 },
              { path: '/drivers/nearby?lat=36.8&lng=10.18', expected: 401 },
            ];
            for (const check of checks) {
              const response = await fetch(base + check.path, { headers: check.headers || {} });
              const body = await response.text();
              console.log(`${check.path} -> ${response.status} ${body.slice(0, 300)}`);
              if (response.status !== check.expected) {
                throw new Error(`Expected HTTP ${check.expected} for ${check.path}, got ${response.status}`);
              }
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Check production social authentication routes
        env:
          API_BASE_URL: https://wassel-backend-ds3n.onrender.com
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.API_BASE_URL.replace(/\/$/, '');
            const providers = ['google', 'apple'];
            for (const provider of providers) {
              const response = await fetch(`${base}/auth/${provider}?role=client`, { redirect: 'manual' });
              const body = await response.text();
              console.log(`${provider} -> ${response.status} location=${response.headers.get('location') || 'none'} body=${body.slice(0, 300)}`);
              if (![302, 303, 307, 308, 503].includes(response.status)) {
                throw new Error(`Unexpected HTTP ${response.status} for /auth/${provider}`);
              }
              if (response.status === 302 || response.status === 303 || response.status === 307 || response.status === 308) {
                const location = response.headers.get('location') || '';
                if (!location.startsWith(provider === 'google' ? 'https://accounts.google.com/' : 'https://appleid.apple.com/')) {
                  throw new Error(`Unexpected OAuth redirect for ${provider}: ${location}`);
                }
              }
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Check production API malformed input handling
        env:
          API_BASE_URL: https://wassel-backend-ds3n.onrender.com
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.API_BASE_URL.replace(/\/$/, '');
            const notFound = await fetch(base + '/definitely-not-a-real-route');
            const notFoundBody = await notFound.text();
            console.log(`404 check -> ${notFound.status} ${notFoundBody.slice(0, 300)}`);
            if (notFound.status !== 404) throw new Error(`Expected HTTP 404, got ${notFound.status}`);

            const malformed = await fetch(base + '/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: '{"email":'
            });
            const malformedBody = await malformed.text();
            console.log(`Malformed JSON check -> ${malformed.status} ${malformedBody.slice(0, 300)}`);
            if (malformed.status !== 400) throw new Error(`Expected HTTP 400 for malformed JSON, got ${malformed.status}`);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
